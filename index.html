<!doctype html>

  <head>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <body>

    <!-- Top Console Navigation Header -->

      <!-- Navigation Tabs: Dashboard -> Curriculum -> Milestones -> References -> Interactive Sandboxes -->
      <nav class="nav-tabs" aria-label="Main Navigation">
        <button class="nav-tab-btn active" data-view="dashboard">Dashboard</button>
        <button class="nav-tab-btn" data-view="curriculum">Course Curriculum</button>
        <button class="nav-tab-btn" data-view="milestones">Milestone Labs</button>
